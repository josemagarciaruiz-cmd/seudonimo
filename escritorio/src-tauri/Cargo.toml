[package]
name = "seudonimo"
version = "0.6.2"
description = "Seudónimo"
authors = ["José María García Ruiz"]
license-file = "../../LICENSE.md"
edition = "2021"

[lib]
name = "seudonimo_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
getrandom = "0.2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
