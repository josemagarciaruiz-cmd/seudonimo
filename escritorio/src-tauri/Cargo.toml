[package]
name = "aurea-asistente-local"
version = "0.1.0"
description = "Áurea Asistente Local"
authors = ["José María García Ruiz"]
edition = "2021"

[lib]
name = "aurea_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
getrandom = "0.2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
